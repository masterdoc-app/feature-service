name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-feature-service-${{ github.ref }}
  cancel-in-progress: false

env:
  REMOTE_PATH: /opt/feature-service
  REMOTE_ENV: /etc/masterdoc-feature-service/.env

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Gradle test
        run: ./gradlew test --no-daemon

  deploy:
    name: Deploy Compose to VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets
        env:
          HOST: ${{ secrets.ZITADEL_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.ZITADEL_DEPLOY_USER }}
          KEY: ${{ secrets.ZITADEL_SSH_PRIVATE_KEY }}
          ISSUER: ${{ secrets.ZITADEL_ISSUER }}
          JWK: ${{ secrets.ZITADEL_JWK_SET_URI }}
        run: |
          test -n "$HOST" || { echo "Add secret ZITADEL_DEPLOY_HOST"; exit 1; }
          test -n "$USER_NAME" || { echo "Add secret ZITADEL_DEPLOY_USER"; exit 1; }
          test -n "$KEY" || { echo "Add secret ZITADEL_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$ISSUER" || { echo "Add secret ZITADEL_ISSUER"; exit 1; }
          test -n "$JWK" || { echo "Add secret ZITADEL_JWK_SET_URI"; exit 1; }

      - name: Load SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ZITADEL_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.ZITADEL_DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Build runtime .env
        env:
          ZITADEL_ISSUER: ${{ secrets.ZITADEL_ISSUER }}
          ZITADEL_JWK_SET_URI: ${{ secrets.ZITADEL_JWK_SET_URI }}
        run: |
          cat > runtime.env <<EOF
          FEATURE_SERVICE_PORT=8082
          ZITADEL_ISSUER=${ZITADEL_ISSUER}
          ZITADEL_JWK_SET_URI=${ZITADEL_JWK_SET_URI}
          EOF
          chmod 600 runtime.env

      - name: Rsync sources and deploy files
        env:
          HOST: ${{ secrets.ZITADEL_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.ZITADEL_DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            "${USER_NAME}@${HOST}" "mkdir -p ${REMOTE_PATH} /etc/masterdoc-feature-service"
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes" \
            --exclude '.git' \
            --exclude '.gradle' \
            --exclude 'build' \
            --exclude 'runtime.env' \
            ./ "${USER_NAME}@${HOST}:${REMOTE_PATH}/"

      - name: Install .env and Compose up
        env:
          HOST: ${{ secrets.ZITADEL_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.ZITADEL_DEPLOY_USER }}
        run: |
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes \
            runtime.env "${USER_NAME}@${HOST}:${REMOTE_ENV}"
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes "${USER_NAME}@${HOST}" bash -s <<EOF
          set -euo pipefail
          chmod 600 ${REMOTE_ENV}
          ln -sfn ${REMOTE_ENV} ${REMOTE_PATH}/deploy/.env
          cd ${REMOTE_PATH}/deploy
          docker compose --env-file .env up -d --build --wait
          curl -sf http://127.0.0.1:8082/actuator/health
          EOF
