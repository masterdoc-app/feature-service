server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/features}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:features}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:features}
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

logging.level.root=INFO

# Optional: enables GET /users/{id}/features via Zitadel Management API (dashboard assignee check).
zitadel.issuer=${ZITADEL_ISSUER:}
zitadel.mgmt-token=${ZITADEL_MGMT_TOKEN:}
zitadel.project-id=${ZITADEL_PROJECT_ID:}
